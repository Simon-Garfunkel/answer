<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon and Garfunkel Adventure</title>
  <style>
    /* Classic retro terminal styling */
    body {
      background-color: #111;
      color: #33ff33;
      font-family: 'Courier New', Courier, monospace;
      padding: 40px;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.6;
    }

    #terminal-box {
      border: 1px solid #33ff33;
      padding: 20px;
      min-height: 160px;
      margin-bottom: 20px;
      background-color: #0a0a0a;
    }

    .code-reveal {
      margin-top: 20px;
      padding: 12px;
      border: 1px dashed #ffff33;
      color: #ffff33;
      font-weight: bold;
      background-color: #1a1a00;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      background-color: #000;
      color: #33ff33;
      border: 1px solid #33ff33;
      padding: 10px;
      font-family: inherit;
      font-size: 16px;
      flex-grow: 1;
      outline: none;
    }

    button {
      background-color: #33ff33;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #28cc28;
    }

    #next-btn {
      display: none;
      width: 100%;
      background-color: #ffff33;
    }

    #next-btn:hover {
      background-color: #cccc28;
    }

    #feedback {
      margin-top: 15px;
      color: #ff4444;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <!-- Main display for password prompts and revealed code words -->
  <div id="terminal-box">
    <div id="prompt-text"></div>
    <div id="reward-box" class="code-reveal" style="display: none;"></div>
  </div>

  <!-- Password input controls -->
  <div class="input-area" id="controls">
    <input type="text" id="password-input" placeholder="Enter password..." autocomplete="off">
    <button id="submit-btn">SUBMIT</button>
  </div>

  <!-- Button to advance after reading the code word -->
  <button id="next-btn">PROCEED TO NEXT PASSWORD &gt;&gt;</button>

  <!-- Error messages -->
  <div id="feedback"></div>

  <script>
    // 1. DEFINE YOUR 5 PASSWORDS AND REWARD CODE WORDS HERE
    const sequence = [
      {
        prompt: "1 OF 5: Enter Password 1.",
        password: "typethisintwicealluppercaseNOspacesLOWERCASE",
        codeWord: "art"
      },
      {
        prompt: "2 OF 5: Enter Password 2.",
        password: "EnterTheWords:485then-colonTHENUMBERtwo",
        codeWord: "boxer"
      },
      {
        prompt: "3 OF 5: Enter Password 3.",
        password: "CarrotCaretKarrritThenTheSymbol^",
        codeWord: "groovy"
      },
      {
        prompt: "4 OF 5: Enter Password 4.",
        password: ".dot,comma..commaTHEWORDcommaINQUOTES",
        codeWord: "homeward"
      },
      {
        prompt: "5 OF 5: Enter Password 5.",
        password: "Under_and_Score_wordsseperatedbyhyphens",
        codeWord: "silence"
      }
    ];

    const finalMessage = "ALL 5 PASSWORDS ACCEPTED!";

    // 2. GAME STATE & HTML ELEMENTS
    let currentIndex = 0;

    const promptText = document.getElementById("prompt-text");
    const rewardBox = document.getElementById("reward-box");
    const passwordInput = document.getElementById("password-input");
    const submitBtn = document.getElementById("submit-btn");
    const nextBtn = document.getElementById("next-btn");
    const feedback = document.getElementById("feedback");
    const controls = document.getElementById("controls");

    // 3. GAME FUNCTIONS
    function loadPrompt() {
      // Reset UI for the new stage
      rewardBox.style.display = "none";
      nextBtn.style.display = "none";
      feedback.textContent = "";

      if (currentIndex < sequence.length) {
        promptText.textContent = sequence[currentIndex].prompt;
        controls.style.display = "flex";
        passwordInput.value = "";
        passwordInput.focus();
      } else {
        // All 5 stages completed
        promptText.textContent = finalMessage;
        controls.style.display = "none";
      }
    }

    function checkPassword() {
      const userGuess = passwordInput.value.trim().toLowerCase();
      const correctPassword = sequence[currentIndex].password.toLowerCase();

      if (userGuess === correctPassword) {
        feedback.textContent = "";
        controls.style.display = "none";

        // Reveal the code word in yellow
        rewardBox.textContent = "ACCESS GRANTED. SAY THIS CODE WORD TO YOUR TEAMMATES: " + sequence[currentIndex].codeWord;
        rewardBox.style.display = "block";

        // Show the button to move to the next password
        nextBtn.style.display = "block";
        nextBtn.focus();
      } else {
        feedback.textContent = "INVALID PASSWORD. Try again";
        passwordInput.value = "";
        passwordInput.focus();
      }
    }

    // 4. EVENT LISTENERS
    submitBtn.addEventListener("click", checkPassword);

    passwordInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });

    nextBtn.addEventListener("click", function() {
      currentIndex++;
      loadPrompt();
    });

    // Start the sequence
    loadPrompt();
  </script>

</body>
</html>
