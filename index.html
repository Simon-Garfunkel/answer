<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ACCESS // TERMINAL 04</title>
    <style>
        /* Retro CRT Terminal Styling */
        body {
            background-color: #050505;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80vh;
            text-shadow: 0 0 5px rgba(51, 255, 51, 0.7);
            overflow-x: hidden;
        }

        /* Subtle scanline effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        .terminal-box {
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
        }

        p {
            line-height: 1.5;
            margin: 10px 0;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }

        .prompt {
            margin-right: 10px;
            font-weight: bold;
        }

        input {
            background: transparent;
            border: none;
            color: #33ff33;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            width: 100%;
            text-shadow: 0 0 5px rgba(51, 255, 51, 0.7);
            caret-color: #33ff33;
        }

        .denied {
            color: #ff3333;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.7);
        }

        .granted {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
        }

        .hidden {
            display: none;
        }

        /* Blinking cursor animation for narrative text */
        .cursor::after {
            content: "█";
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="terminal-box">
    <p>*** MAINFRAME SECURITY GATEWAY v2.4 ***</p>
    <p id="status-msg">ENTER PASSPHRASE TO CONTINUE:</p>

    <div class="input-line" id="input-container">
        <span class="prompt">&gt;</span>
        <!-- Change type="text" to type="password" if you want asterisks/dots -->
        <input type="text" id="password-input" autocomplete="off" autofocus>
    </div>

    <!-- Secret content revealed upon success -->
    <div id="secret-content" class="hidden">
        <br>
        <p class="granted">*** ACCESS GRANTED ***</p>
        <p>The heavy steel blast doors grind open, revealing a dimly lit corridor smelling of ozone and damp stone.</p>
        <p class="cursor">What do you do next?</p>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    // Change this to whatever password your players need to find!
    const SECRET_PASSWORD = "ROBERT"; 
    
    // Set to true if capitalization matters, false if "xyzzy" and "XYZZY" both work
    const CASE_SENSITIVE = false; 
    // ---------------------

    const inputField = document.getElementById('password-input');
    const statusMsg = document.getElementById('status-msg');
    const inputContainer = document.getElementById('input-container');
    const secretContent = document.getElementById('secret-content');

    // Keep focus on the input field even if the user clicks elsewhere
    document.addEventListener('click', () => {
        inputField.focus();
    });

    // Listen for the Enter key
    inputField.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            checkPassword();
        }
    });

    function checkPassword() {
        let userGuess = inputField.value.trim();
        let target = SECRET_PASSWORD;

        if (!CASE_SENSITIVE) {
            userGuess = userGuess.toUpperCase();
            target = target.toUpperCase();
        }

        if (userGuess === target) {
            // AUTHORIZED
            inputContainer.classList.add('hidden');
            statusMsg.classList.add('hidden');
            secretContent.classList.remove('hidden');
            
            // Optional: Uncomment the line below to redirect to another page instead
            // window.location.href = "level2.html";
        } else {
            // DENIED
            statusMsg.textContent = "ACCESS DENIED. INVALID PASSPHRASE. TRY AGAIN:";
            statusMsg.className = "denied";
            inputField.value = "";
        }
    }
</script>

</body>
</html>
